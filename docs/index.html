    <script type="text/javascript">
      const pyodideWorker = new Worker("./app.js");
      pyodideWorker.busy = false
      pyodideWorker.queue = []
      
      let patching = 0
      
      function send_change(jsdoc, event) {
        if ((event.setter_id != null && event.setter_id == 'py') || (patching > 0)) {
          return
        } else if (pyodideWorker.busy && event.model && event.attr) {
          let events = []
          for (const old_event of pyodideWorker.queue) {
            if (!(old_event.model === event.model && old_event.attr === event.attr)) {
              events.push(old_event)
            }
          }
          events.push(event)
          pyodideWorker.queue = events
          return
        }
        const patch = jsdoc.create_json_patch([event])
        pyodideWorker.busy = true
        pyodideWorker.postMessage({type: 'patch', patch: patch})
      }
      
      pyodideWorker.onmessage = async (event) => {
        const msg = event.data
      
        const body = document.getElementsByTagName('body')[0]
        const loading_msgs = document.getElementsByClassName('pn-loading-msg')
        if (msg.type === 'idle') {
          if (pyodideWorker.queue.length) {
            const patch = pyodideWorker.jsdoc.create_json_patch(pyodideWorker.queue)
            pyodideWorker.busy = true
            pyodideWorker.queue = []
            pyodideWorker.postMessage({type: 'patch', patch: patch})
          } else {
            pyodideWorker.busy = false
          }
        } else if (msg.type === 'status') {
          let loading_msg
          if (loading_msgs.length) {
            loading_msg = loading_msgs[0]
          } else if (body.classList.contains('pn-loading')) {
            loading_msg = document.createElement('div')
            loading_msg.classList.add('pn-loading-msg')
            body.appendChild(loading_msg)
          }
          if (loading_msg != null) {
            loading_msg.innerHTML = msg.msg
          }
        } else if (msg.type === 'render') {
          const docs_json = JSON.parse(msg.docs_json)
          const render_items = JSON.parse(msg.render_items)
          const root_ids = JSON.parse(msg.root_ids)
      
          // Remap roots in message to element IDs
          const root_els = document.querySelectorAll('[data-root-id]')
          const data_roots = []
          for (const el of root_els) {
             el.innerHTML = ''
             data_roots.push([el.getAttribute('data-root-id'), el.id])
          }
          data_roots.sort((a, b) => a[0]<b[0] ? -1: 1)
          const roots = {}
          for (let i=0; i<data_roots.length; i++) {
            roots[root_ids[i]] = data_roots[i][1]
          }
          render_items[0]['roots'] = roots
          render_items[0]['root_ids'] = root_ids
      
          // Clear pre-rendered contents
          Bokeh.index.roots.map((v) => v.remove())
      
          // Embed content
          const [views] = await Bokeh.embed.embed_items(docs_json, render_items)
      
          // Remove loading spinner and message
          body.classList.remove("pn-loading", "arc")
          for (const loading_msg of loading_msgs) {
            loading_msg.remove()
          }
      
          // Setup bi-directional syncing
          pyodideWorker.jsdoc = jsdoc = [...views.roots.values()][0].model.document
          jsdoc.on_change(send_change.bind(null, jsdoc), false)
          pyodideWorker.postMessage({'type': 'rendered'})
          pyodideWorker.postMessage({'type': 'location', location: JSON.stringify(window.location)})
        } else if (msg.type === 'patch') {
          try {
            patching += 1
            pyodideWorker.jsdoc.apply_json_patch(msg.patch, msg.buffers)
          } finally {
            patching -= 1
          }
        }
      };
    </script>

t/css/markdown.css"}},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;h1 id=&amp;quot;what-makes-a-song-popular-on-spotify&amp;quot;&amp;gt;What Makes a Song Popular on Spotify? &amp;lt;a class=&amp;quot;header-anchor&amp;quot; href=&amp;quot;#what-makes-a-song-popular-on-spotify&amp;quot;&amp;gt;\u00b6&amp;lt;/a&amp;gt;&amp;lt;/h1&amp;gt;\n"}},{"type":"object","name":"panel.models.markup.HTML","id":"p1020","attributes":{"css_classes":["markdown"],"styles":{"type":"map","entries":[["background","#1a1a1a"],["border-left","4px solid #2a9d8f"],["padding","12px 16px"],["border-radius","4px"],["color","#cccccc"],["font-size","14px"],["line-height","1.7"]]},"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1018"},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;p&amp;gt;Every day, millions of songs compete for listener attention on Spotify.\nSome tracks go viral overnight while others with similar sounds never break through.\n&amp;lt;strong&amp;gt;Is there a formula to popularity \u2014 or is it largely unpredictable?&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;\n&amp;lt;p&amp;gt;This project explores over &amp;lt;strong&amp;gt;113,000 Spotify tracks&amp;lt;/strong&amp;gt; spanning 114 genres to answer\nthat question using audio features like acousticness, danceability, valence, and more.&amp;lt;/p&amp;gt;\n"}},{"type":"object","name":"panel.models.markup.HTML","id":"p1021","attributes":{"css_classes":["markdown"],"styles":{"type":"map","entries":[["color","white"]]},"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1018"},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;h3&amp;gt;Our Approach&amp;lt;/h3&am ebkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1018"},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;h3&amp;gt;Dataset&amp;lt;/h3&amp;gt;\n"}},{"type":"object","name":"panel.models.markup.HTML","id":"p1024","attributes":{"css_classes":["markdown"],"styles":{"type":"map","entries":[["background","#1a1a1a"],["border-left","4px solid #2a9d8f"],["padding","12px 16px"],["border-radius","4px"],["color","#cccccc"],["font-size","14px"],["line-height","1.7"]]},"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1018"},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;ul&amp;gt;\n&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Source:&amp;lt;/strong&amp;gt; Spotify Tracks Dataset (Kaggle)&amp;lt;/li&amp;gt;\n&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Size:&amp;lt;/strong&amp;gt; ~114,000 tracks across 114 genres&amp;lt;/li&amp;gt;\n&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Features:&amp;lt;/strong&amp;gt; danceability, energy, acousticness, valence, tempo, speechiness,\ninstrumentalness, loudness, liveness, duration, explicit, popularity&amp;lt;/li&amp;gt;\n&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Note:&amp;lt;/strong&amp;gt; Popularity scores reflect a point-in-time snapshot and do not account\nfor artist fame, release timing, or playlist placement \u2014 all of which likely\nmatter more than audio features alone.&amp;lt;/li&amp;gt;\n&amp;lt;/ul&amp;gt;\n"}}]}}}},{"type":"object","name":"TabPanel","id":"p1064","attributes":{"name":"Column00151","title":"Initial Insights","child":{"type":"object","name":"panel.models.layout.Column","id":"p1026","attributes":{"name":"Column00151","stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":" ","children":[{"type":"object","name":"panel.models.markup.HTML","id":"p1124","attributes":{"css_classes":["markdown"],"styles":{"type":"map","entries":[["color","#2a9d8f"],["font-size","22px"]]},"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1018"},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;h1 id=&amp;quot;what-did-we-learn&amp;quot;&amp;gt;What Did We Learn? &amp;lt;a class=&amp;quot;header-anchor&amp;quot; href=&amp;quot;#what-did-we-learn&amp;quot;&amp;gt;\u00b6&amp;lt;/a&amp;gt;&amp;lt;/h1&amp;gt;\n"}},{"type":"object","name":"panel.models.markup.HTML","id":"p1125","attributes":{"css_classes":["markdown"],"styles":{"type":"map","entries":[["background","#1a1a1a"],["border-left","4px solid #2a9d8f"],["padding","12px 16px"],["border-radius","4px"],["color","#cccccc"],["font-size","14px"],["line-height","1.7"]]},"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1018"},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;1. Genre context shapes popularity ceilings.&amp;lt;/strong&amp;gt;\nDance, Hip-Hop, and Pop genre groups consistently produce the most popular tracks,\nwhile Classical and Ambient genres cluster at the lower end. If you are making music\nfor reach, genre positioning matters.&amp;lt;/p&amp;gt;\n"}},{"type":"object","name":"panel.models.markup.HTML","id":"p1126","attributes":{"css_classes":["markdown"],"styles":{"type":"map","entries":[["background","#1a1a1a"],["border-left","4px solid #2a9d8f"],["padding","12px 16px"],["border-radius","4px"],["color","#cccccc"],["font-size","14px"],["line-height","1.7"]]},"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1018"},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;2. Less acoustic, more danceable songs tend to be more popular \u2014 but the effect is modest.&amp;lt;/strong&amp;gt;\nAcousticness and instrumentalness are negatively associated with popularity, while\ndanceability and loudness are positively associated. However, with R\u00b2 = 0.16, audio\nfeatures only explain a small fraction of what makes a song popular. External factors\nlike artist fame, playlist placement, and release timing likely dominate.&amp;lt;/p&amp;gt;\n"}},{"type":"object","name":"panel.models.markup.HTML","id":"p1127","attributes":{"css_classes":["markdown"],"styles":{"type":"map","entries":[["background","#1a1a1a"],["border-left","4px solid #2a9d8f"],["padding","12px 16px"],["border-radius","4px"],["color","#cccccc"],["font-size","14px"],["line-height","1.7"]]},"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1018"},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;3. Popularity is rare by design.&amp;lt;/strong&amp;gt;\nThe heavily skewed popularity distribution reveals that most songs on Spotify go largely\nunheard. The dataset is dominated by mid-tier and obscure tracks, meaning the few\nbreakout hits are genuine statistical outliers \u2014 not just songs that happened to sound\na certain way.&amp;lt;/p&amp;gt;\n"}},{"type":"object","name":"panel.models.markup.HTML","id":"p1128","attributes":{"css_classes":["markdown"],"styles":{"type":"map","entries":[["color","#2a9d8f"]]},"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1018"},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;h3&amp;gt;What Could Be Done Next?&amp;lt;/h3&amp;gt;\n"}},{"type":"object","name":"panel.models.markup.HTML","id":"p1129","attributes":{"css_classes":["markdown"],"styles":{"type":"map","entries":[["background","#1a1a1a"],["border-left","4px solid #2a9d8f"],["padding","12px 16px"],["border-radius","4px"],["color","#cccccc"],["font-size","14px"],["line-height","1.7"]]},"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1018"},{"id":"p1154"}],"margin":[5,10],"align":"start","text":"&amp;lt;ul&amp;gt;\n&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Add temporal data:&amp;lt;/strong&amp;gt; Knowing when a song was released and how its popularity\nchanged over time would reveal whether certain audio trends rise and fall with eras.&amp;lt;/li&amp;gt;\n&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Include artist-level features:&amp;lt;/strong&amp;gt; Follower counts, prior hit history, and label\naffiliation would likely dramatically improve predictive power.&amp;lt;/li&amp;gt;\n&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Model by genre group separately:&amp;lt;/strong&amp;gt; A random forest trained only on Dance / Hip-Hop\ntracks might find very different feature importance patterns than one trained on all genres.&amp;lt;/li&amp;gt;\n&amp;lt;/ul&amp;gt;\n"}}]}}}}]}},{"type":"object","name":"panel.models.layout.Card","id":"p1131","attributes":{"name":"nav-13667939872","tags":["nav"],"css_classes":["card"],"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1009"},{"id":"p1154"}],"width":320,"
